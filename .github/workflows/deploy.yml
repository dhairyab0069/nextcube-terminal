# Builds, checks and deploys nextcube-terminal to GitHub Pages
# (served at https://dhairyab0069.github.io/nextcube-terminal/).
#
# - Pull requests: build + checks only (no deploy), so broken HTML, missing
#   files or module syntax errors fail the PR.
# - Push to main / manual run / repository_dispatch "rebuild": build, check,
#   deploy. The main site embeds whatever is live here, so it doesn't need
#   redeploying when this repo changes.
#
# Requires Settings → Pages → Source = "GitHub Actions".

name: Deploy terminal

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [rebuild]

permissions:
  contents: read

# One deploy at a time; let an in-flight deploy finish rather than cancel it.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build _site (cache-bust, version.json, file/import/syntax checks)
        run: node .github/scripts/build.mjs

      # npx crashes npm's resolver on html-validate's optional vitest/jest peers
      # ("Cannot read properties of null (reading 'edgesOut')"); install into a
      # temp prefix with --legacy-peer-deps instead, as the main site does.
      - name: Validate HTML
        run: |
          npm install --no-save --no-audit --no-fund --legacy-peer-deps --prefix "$RUNNER_TEMP/html-validate" html-validate@10.9.0
          "$RUNNER_TEMP/html-validate/node_modules/.bin/html-validate" _site/index.html

      - name: Check external links (non-blocking)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress _site/index.html
          fail: false

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
